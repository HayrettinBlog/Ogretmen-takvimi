<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Öğretmen Takvimi 2026–2027</title>
<meta name="theme-color" content="#233B32">
<style>
  :root{
    --board:#233B32;
    --board-dark:#1A2C26;
    --chalk:#F3EFE3;
    --chalk-dim:#C9C2AE;
    --ochre:#D6A83D;
    --rose:#C1665A;
    --sky:#5C93A6;
    --line:rgba(243,239,227,0.14);
    --card:#2C463C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--board);
    color:var(--chalk);
    font-family:'Iowan Old Style','Georgia',ui-serif,serif;
    min-height:100vh;
    padding-bottom:48px;
  }
  .sans{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }

  header{
    padding:28px 20px 18px;
    text-align:center;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, var(--line) 39px 40px);
    opacity:0.35;
    pointer-events:none;
  }
  .eyebrow{
    font-family:'Iowan Old Style',Georgia,serif;
    font-style:italic;
    color:var(--chalk-dim);
    font-size:14px;
    letter-spacing:0.02em;
    margin:0 0 2px;
    position:relative;
  }
  h1{
    font-size:20px;
    margin:0;
    font-weight:600;
    letter-spacing:0.01em;
    position:relative;
  }
  .today{
    font-size:12.5px;
    color:var(--chalk-dim);
    margin-top:6px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    position:relative;
  }

  .hero{
    padding:34px 20px 30px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  .hero .label{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:13px;
    color:var(--chalk-dim);
    margin-bottom:10px;
  }
  .hero .number{
    font-size:96px;
    line-height:0.9;
    font-weight:700;
    color:var(--ochre);
    font-family:'Iowan Old Style',Georgia,serif;
    letter-spacing:-0.02em;
  }
  .hero .unit{
    font-size:19px;
    color:var(--chalk);
    margin-top:6px;
  }
  .hero .target{
    margin-top:14px;
    font-size:13px;
    color:var(--chalk-dim);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }

  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:16px 20px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:13.5px;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    color:var(--chalk-dim);
    background:transparent;
  }
  .tab.active{
    background:var(--ochre);
    border-color:var(--ochre);
    color:var(--board-dark);
    font-weight:600;
  }

  .list{
    padding:4px 16px 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .item{
    background:var(--card);
    border-radius:12px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    border-left:3px solid var(--sky);
  }
  .item.cat-milli{ border-left-color: var(--rose); }
  .item.cat-dini{ border-left-color: var(--sky); }
  .item.cat-okul{ border-left-color: var(--ochre); }
  .item.cat-diger{ border-left-color: var(--chalk-dim); }
  .item.past{ opacity:0.4; }
  .item.today-item{
    outline:1.5px solid var(--ochre);
  }

  .item-left{ min-width:0; }
  .item-name{
    font-size:15.5px;
    line-height:1.3;
  }
  .item-date{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:12px;
    color:var(--chalk-dim);
    margin-top:3px;
  }
  .item-note{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:11.5px;
    color:var(--chalk-dim);
    margin-top:3px;
    font-style:italic;
  }
  .item-count{
    text-align:right;
    flex:0 0 auto;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  .item-count .n{
    font-size:22px;
    font-weight:700;
    color:var(--chalk);
    font-family:'Iowan Old Style',Georgia,serif;
  }
  .item-count .u{
    font-size:10.5px;
    color:var(--chalk-dim);
    display:block;
    margin-top:1px;
  }

  .section-title{
    padding:18px 20px 4px;
    font-size:12px;
    text-transform:none;
    color:var(--chalk-dim);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }

  footer{
    text-align:center;
    padding:24px 20px 8px;
    color:var(--chalk-dim);
    font-size:11.5px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    line-height:1.6;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">2026 – 2027 Eğitim Öğretim Yılı</p>
  <h1>Öğretmen Takvimi</h1>
  <p class="today" id="todayLabel"></p>
</header>

<div class="hero">
  <div class="label" id="heroLabel">Okulun kapanmasına</div>
  <div class="number" id="heroNumber">–</div>
  <div class="unit">gün kaldı</div>
  <div class="target" id="heroTarget"></div>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-cat="tumu">Tümü</button>
  <button class="tab" data-cat="okul">Okul Takvimi</button>
  <button class="tab" data-cat="milli">Millî Tatiller</button>
  <button class="tab" data-cat="dini">Dinî Bayramlar</button>
  <button class="tab" data-cat="diger">Diğer Günler</button>
</div>

<div class="list" id="list"></div>

<footer>
  Tarihler MEB'in 2026-2027 çalışma takvimi ve Diyanet İşleri Başkanlığı dinî günler takvimine dayanmaktadır.<br>
  Bakanlık yıl içinde güncelleme yapabilir.
</footer>

<script>
// ---- Veri: tüm önemli tarihler ----
// date: YYYY-MM-DD (yerel gün, saat farkı sorun yaratmasın diye öğle 12:00 kabul edilir)
const EVENTS = [
  // OKUL TAKVİMİ
  {name:"Öğretmenler İçin Mesleki Çalışmalar Başlıyor", date:"2026-09-01", cat:"okul"},
  {name:"Uyum Eğitimleri (Okul Öncesi & 1. Sınıf)", date:"2026-09-07", cat:"okul", note:"7–11 Eylül arası"},
  {name:"1. Dönem Başlangıcı — Okul Açılıyor", date:"2026-09-14", cat:"okul"},
  {name:"1. Dönem Ara Tatili Başlıyor", date:"2026-11-16", cat:"okul"},
  {name:"1. Dönem Ara Tatili Bitiyor", date:"2026-11-20", cat:"okul"},
  {name:"1. Dönem Sonu — Karne Günü", date:"2027-01-22", cat:"okul"},
  {name:"Yarıyıl Tatili Başlıyor", date:"2027-01-25", cat:"okul"},
  {name:"Yarıyıl Tatili Bitiyor", date:"2027-02-05", cat:"okul"},
  {name:"2. Dönem Başlangıcı", date:"2027-02-08", cat:"okul"},
  {name:"2. Dönem Ara Tatili Başlıyor", date:"2027-03-08", cat:"okul", note:"Ramazan Bayramı arefesiyle aynı güne denk geliyor"},
  {name:"2. Dönem Ara Tatili Bitiyor", date:"2027-03-12", cat:"okul"},
  {name:"Okulun Kapanışı — Karne Günü", date:"2027-06-25", cat:"okul"},

  // MİLLÎ / RESMÎ TATİLLER
  {name:"Yılbaşı", date:"2027-01-01", cat:"milli"},
  {name:"Cumhuriyet Bayramı Yarım Gün Tatili", date:"2026-10-28", cat:"milli", note:"Öğleden sonra tatil başlar"},
  {name:"29 Ekim Cumhuriyet Bayramı", date:"2026-10-29", cat:"milli"},
  {name:"23 Nisan Ulusal Egemenlik ve Çocuk Bayramı", date:"2027-04-23", cat:"milli"},
  {name:"1 Mayıs Emek ve Dayanışma Günü", date:"2027-05-01", cat:"milli"},
  {name:"19 Mayıs Atatürk'ü Anma, Gençlik ve Spor Bayramı", date:"2027-05-19", cat:"milli", note:"Kurban Bayramı'nın 4. gününe denk geliyor"},

  // DİNÎ BAYRAMLAR
  {name:"Ramazan Bayramı Arefesi", date:"2027-03-08", cat:"dini", note:"Yarım gün tatil"},
  {name:"Ramazan Bayramı 1. Gün", date:"2027-03-09", cat:"dini"},
  {name:"Ramazan Bayramı 2. Gün", date:"2027-03-10", cat:"dini"},
  {name:"Ramazan Bayramı 3. Gün", date:"2027-03-11", cat:"dini"},
  {name:"Kurban Bayramı Arefesi", date:"2027-05-15", cat:"dini", note:"Yarım gün tatil"},
  {name:"Kurban Bayramı 1. Gün", date:"2027-05-16", cat:"dini"},
  {name:"Kurban Bayramı 2. Gün", date:"2027-05-17", cat:"dini"},
  {name:"Kurban Bayramı 3. Gün", date:"2027-05-18", cat:"dini"},
  {name:"Kurban Bayramı 4. Gün", date:"2027-05-19", cat:"dini", note:"19 Mayıs ile aynı gün"},

  // DİĞER ÖNEMLİ GÜNLER
  {name:"Atatürk'ü Anma Günü", date:"2026-11-10", cat:"diger"},
  {name:"Öğretmenler Günü", date:"2026-11-24", cat:"diger"},
  {name:"Dünya Kadınlar Günü", date:"2027-03-08", cat:"diger", note:"Ramazan Bayramı arefesiyle aynı güne denk geliyor"},
  {name:"İstiklal Marşı'nın Kabulü", date:"2027-03-12", cat:"diger"},
  {name:"Çanakkale Zaferi ve Şehitleri Anma Günü", date:"2027-03-18", cat:"diger"},
];

// ---- Yardımcılar ----
function parseLocal(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  return new Date(y, m-1, d, 12, 0, 0); // öğle 12:00, saat dilimi sorunlarına karşı
}
function startOfToday(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 12, 0, 0);
}
function daysBetween(target, today){
  return Math.round((target - today) / 86400000);
}
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUN = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
function formatDate(d){
  return `${d.getDate()} ${AY[d.getMonth()]} ${d.getFullYear()}, ${GUN[d.getDay()]}`;
}

// ---- Render ----
const today = startOfToday();
document.getElementById("todayLabel").textContent = "Bugün: " + formatDate(today);

const SCHOOL_CLOSE = parseLocal("2027-06-25");
const closeDays = daysBetween(SCHOOL_CLOSE, today);
document.getElementById("heroNumber").textContent = closeDays >= 0 ? closeDays : "🎉";
document.getElementById("heroLabel").textContent = closeDays >= 0 ? "Okulun kapanmasına" : "Okul kapandı, iyi tatiller";
document.getElementById("heroTarget").textContent = "Hedef: " + formatDate(SCHOOL_CLOSE);
if(closeDays < 0){
  document.querySelector(".hero .unit").style.display = "none";
}

const listEl = document.getElementById("list");
let currentCat = "tumu";

function render(){
  listEl.innerHTML = "";
  const sorted = [...EVENTS].sort((a,b)=> a.date.localeCompare(b.date));
  const filtered = sorted.filter(e => currentCat === "tumu" || e.cat === currentCat);

  filtered.forEach(e=>{
    const target = parseLocal(e.date);
    const diff = daysBetween(target, today);
    const isPast = diff < 0;
    const isToday = diff === 0;

    const item = document.createElement("div");
    item.className = `item cat-${e.cat}` + (isPast ? " past" : "") + (isToday ? " today-item" : "");

    const left = document.createElement("div");
    left.className = "item-left";
    left.innerHTML = `
      <div class="item-name">${e.name}</div>
      <div class="item-date">${formatDate(target)}</div>
      ${e.note ? `<div class="item-note">${e.note}</div>` : ""}
    `;

    const right = document.createElement("div");
    right.className = "item-count";
    let n, u;
    if(isToday){ n = "Bugün"; u = ""; }
    else if(isPast){ n = "Geçti"; u = ""; }
    else { n = diff; u = "gün kaldı"; }
    right.innerHTML = `<span class="n">${n}</span><span class="u">${u}</span>`;

    item.appendChild(left);
    item.appendChild(right);
    listEl.appendChild(item);
  });
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    render();
  });
});

render();
</script>
</body>
</html>
